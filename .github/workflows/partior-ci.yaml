name: Quorum Signer Plugin CI
on:
  pull_request:
    branches: [ main, release/**, hotfix/**, hotfix-base/** ]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
  push:
    branches: [ main, hotfix-base/** ]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
  workflow_dispatch:  
jobs:
  ci-pipeline:
    uses: partior-libs/controller-3p-pipelines/.github/workflows/pipeline-template-quorum-signer-plugin-ci.yaml@partior-stable
    with:
      CONTROLLER-REPO: partior-libs/controller-3p-pipelines
      PROJECT-REPO: ${{ github.repository }}
    secrets: inherit